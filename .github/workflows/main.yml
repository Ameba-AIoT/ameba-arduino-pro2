name: List .h Files in library

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  list_headers:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find and print .h files in library/
        run: |
          echo "Searching for .h files in the library/ folder..."

          if [ ! -d "library" ]; then
            echo "The folder 'library' does not exist."
            exit 0
          fi

          FILES=$(find library -type f -name "*.h")

          if [ -z "$FILES" ]; then
            echo "No .h files found in library/."
          else
            echo "Found .h files in library/:"
            echo "$FILES"
          fi

