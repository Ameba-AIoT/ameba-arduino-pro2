import os
import re

HEADER_EXTENSIONS = [".h", ".hpp"]

# Regex patterns
class_pattern = re.compile(r'class\s+(\w+)\s*[{:]')
public_pattern = re.compile(r'public\s*:\s*')
private_pattern = re.compile(r'private\s*:\s*')
function_pattern = re.compile(
    r'^\s*([~\w][\w\s:&<>*,]+?\([^;{]*\))\s*;', re.MULTILINE
)

def extract_public_functions_from_file(filepath):
    with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
        text = f.read()

    classes = {}
    for class_match in class_pattern.finditer(text):
        class_name = class_match.group(1)
        start = class_match.end()

        # find where this class ends (count braces)
        brace_count = 1
        i = start
        while i < len(text) and brace_count > 0:
            if text[i] == '{':
                brace_count += 1
            elif text[i] == '}':
                brace_count -= 1
            i += 1

        class_body = text[start:i]

        # Split public/private parts
        public_functions = []
        mode = None
        lines = class_body.splitlines()

        for line in lines:
            if public_pattern.search(line):
                mode = "public"
                continue
            elif private_pattern.search(line):
                mode = "private"
                continue

            if mode == "public":
                func_match = function_pattern.search(line)
                if func_match:
                    signature = func_match.group(1).strip()
                    public_functions.append(signature)

        if public_functions:
            classes[class_name] = public_functions

    return classes


def walk_repository_and_extract(root=".", folder="library"):
    results = {}

    target_folder = os.path.join(root, folder)
    if not os.path.exists(target_folder):
        print(f"Folder '{folder}' does not exist.")
        return results

    for subdir, _, files in os.walk(target_folder):
        for file in files:
            if any(file.endswith(ext) for ext in HEADER_EXTENSIONS):
                path = os.path.join(subdir, file)
                class_funcs = extract_public_functions_from_file(path)
                if class_funcs:
                    results[path] = class_funcs

    return results


if __name__ == "__main__":
    output = walk_repository_and_extract()

    for filepath, classes in output.items():
        print(f"\n=== File: {filepath} ===")
        for classname, funcs in classes.items():
            print(f"  Class: {classname}")
            for f in funcs:
                print(f"    {f}")
