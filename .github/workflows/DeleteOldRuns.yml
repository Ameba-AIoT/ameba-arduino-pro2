name: Delete Old Runs
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      retain_days:
        description: 'Days to retain runs'
        required: true
        default: '30'
        type: string
      keep_minimum_runs:
        description: 'Minimum runs to keep'
        required: true
        default: '6'
        type: string

jobs:
  delete-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          # Use the manual inputs if triggered manually; otherwise use defaults
          retain_days: ${{ github.event.inputs.retain_days || 30 }}
          keep_minimum_runs: ${{ github.event.inputs.keep_minimum_runs || 6 }}
