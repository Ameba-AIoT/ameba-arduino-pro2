# .github/workflows/check-example-links.yml
name: Example guide Links check

on:
  push:
    paths:
      - 'Arduino_package/hardware/libraries/**/*.ino'
  pull_request:
    paths:
      - 'Arduino_package/hardware/libraries/**/*.ino'
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          sparse-checkout-cone: false  
          sparse-checkout: |
            Arduino_package/hardware/libraries
            !Arduino_package/hardware/libraries/SPI/examples/Camera_2_Lcd
            !Arduino_package/hardware/libraries/SPI/examples/Camera_2_Lcd_JPEGDEC

      - name: Locate .ino files in libraries folder
        run: |
          set -euo pipefail
          ino_dir="Arduino_package/hardware/libraries"
          echo "📂 Searching in: $ino_dir"
          find "$ino_dir" -type f -name '*.ino' > ino_files.txt
          if [ ! -s ino_files.txt ]; then
            echo "No .ino files found in libraries folder, skipping."
            exit 0
          fi

      - name: Check Example guide links
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r file; do
            echo "➡️ Checking $file"
            grep -n '^ Example guide:' "$file" | while IFS=: read -r line_num _; do
              url=$(sed -n "$((line_num + 1))p" "$file" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
              if [ -z "$url" ]; then
                echo "::warning file=$file,line=$line_num::Found ' Example guide:' but no URL on next line"
                failed=1
                continue
              fi
              echo "Found URL → '$url'"
              status=$(curl -s -o /dev/null -w '%{http_code}' "$url" || echo "000")
              if [ "$status" -ne 200 ]; then
                echo "::error file=$file,line=$line_num::URL '$url' returned HTTP $status"
                failed=1
              else
                echo "✅ URL OK ($status)"
              fi
            done
          done < ino_files.txt
          if [ "$failed" -ne 0 ]; then
            echo "❌ One or more link checks failed."
            exit 1
          fi
