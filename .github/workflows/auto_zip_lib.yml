name: Auto ZIP Arduino Libraries

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
    paths:
      - 'Arduino_zip_libraries/**'
  push:
    branches:
      - dev
    paths:
      - 'Arduino_zip_libraries/**'

jobs:
  auto-zip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # -------------------------------------------------
      # Step 0: Checkout ONLY Arduino_zip_libraries folder with submodules
      # -------------------------------------------------
      - name: Checkout Arduino_zip_libraries
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          sparse-checkout: |
            Arduino_zip_libraries
          persist-credentials: true

      # -------------------------------------------------
      # Step 1: Checkout private python script
      # -------------------------------------------------
      - name: Checkout private python script
        uses: actions/checkout@v4
        with:
          repository: M-ichae-l/python_script_private
          token: ${{ secrets.GH_PAT }}
          path: private_scripts
          sparse-checkout: |
            ameba_arduino_zip_lib_update.py

      # -------------------------------------------------
      # Step 2: Detect changed src folders, block illegal ZIPs,
      #         run python, then zip only changed folders
      # -------------------------------------------------
      - name: Detect changes, run python and zip changed folders
        run: |
          set -e
          SRC_DIR="Arduino_zip_libraries/src"
          ZIP_DIR="$(pwd)/Arduino_zip_libraries"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
          else
            BASE_REF="HEAD~1"
          fi
          echo "Comparing against $BASE_REF"
          CHANGED_FILES=$(git diff --name-only "$BASE_REF" HEAD || true)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Block manual ZIP changes
          ZIP_CHANGED=$(echo "$CHANGED_FILES" | grep -E '\.zip$' || true)
          SRC_CHANGED=$(echo "$CHANGED_FILES" | grep -E 'Arduino_zip_libraries/src/' || true)
          if [ -n "$ZIP_CHANGED" ] && [ -z "$SRC_CHANGED" ]; then
            echo "❌ ZIP files were modified without src/ changes"
            exit 1
          fi

          # Build array of unique changed folder names under src/
          CHANGED_FOLDERS=()
          while IFS= read -r file; do
            if [[ "$file" == Arduino_zip_libraries/src/* ]]; then
              FOLDER=$(echo "$file" | awk -F'/' '{print $3}')
              if [ -n "$FOLDER" ] && [[ ! " ${CHANGED_FOLDERS[*]} " =~ " ${FOLDER} " ]]; then
                CHANGED_FOLDERS+=("$FOLDER")
              fi
            fi
          done <<< "$CHANGED_FILES"

          if [ ${#CHANGED_FOLDERS[@]} -eq 0 ]; then
            echo "ℹ️ No src/ folder changes detected, skipping"
            exit 0
          fi

          echo "✅ Changed folders: ${CHANGED_FOLDERS[*]}"

          # Run python script with changed folders as arguments
          python private_scripts/ameba_arduino_zip_lib_update.py "${CHANGED_FOLDERS[@]}"

          # Install zip
          sudo apt-get update && sudo apt-get install -y zip

          # Zip only changed folders
          for FOLDER in "${CHANGED_FOLDERS[@]}"; do
            LIB_PATH="$SRC_DIR/$FOLDER"
            ZIP_PATH="$ZIP_DIR/${FOLDER}.zip"
            if [ -d "$LIB_PATH" ]; then
              echo "Zipping $FOLDER → $ZIP_PATH"
              rm -f "$ZIP_PATH"
              (
                cd "$LIB_PATH"
                zip -r "$ZIP_PATH" .
              )
            else
              echo "⚠️ Folder $FOLDER not found in $SRC_DIR, skipping"
            fi
          done

      # -------------------------------------------------
      # Step 3: Cleanup private scripts
      # -------------------------------------------------
      - name: Cleanup private scripts
        if: always()
        run: rm -rf private_scripts

      # -------------------------------------------------
      # Step 4: Commit & push updated ZIPs
      # -------------------------------------------------
      - name: Commit and push ZIP updates
        if: github.event_name != 'pull_request'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet Arduino_zip_libraries/*.zip; then
            echo "No ZIP changes to commit"
          else
            git add Arduino_zip_libraries/*.zip
            git commit -m "Auto-update Arduino ZIP libraries"
            git push
