on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Build ZIP & Update JSON
        id: build
        run: |
          mkdir -p ./Arduino_package/release
          
          # Get Tag and define Filename
          TAG=$(git describe --tags --abbrev=0)
          FILENAME="ameba_pro2_${TAG}.zip"
          
          # Create ZIP (using -j to junk paths if needed, or -r for recursive)
          # We 'cd' in so the ZIP doesn't contain the 'Arduino_package' parent folder
          cd ./Arduino_package
          zip -r "./release/${FILENAME}" hardware/
          cd ..
          
          # Calculate Metadata
          SHA=$(sha256sum "./Arduino_package/release/${FILENAME}" | awk '{print $1}')
          SIZE=$(ls -l "./Arduino_package/release/${FILENAME}" | awk '{print $5}')
          
          # Update JSON with ZIP details
          JSON_FILE="Arduino_package/package_realtek_amebapro2_index.json"
          tmp=$(mktemp)
          jq --arg sha "$SHA" --arg size "$SIZE" --arg ver "$TAG" --arg file "$FILENAME" \
            '(.packages[] | select(.name == "ameba_pro2")).platforms[] |= 
            (.version = $ver | .size = $size | .checksum = "SHA-256:" + $sha | .archiveFileName = $file)' \
            "$JSON_FILE" > "$tmp" && mv "$tmp" "$JSON_FILE"
            
          echo "CURRENT_TAG=$TAG" >> $GITHUB_ENV
          echo "FILENAME=$FILENAME" >> $GITHUB_ENV
        shell: bash

      - name: 3. Commit Index Change
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update board index for ${{ env.CURRENT_TAG }}"
          file_pattern: 'Arduino_package/*.json'

      - name: 4. Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.CURRENT_TAG }}
          files: ./Arduino_package/release/${{ env.FILENAME }}
          generate_release_notes: true
