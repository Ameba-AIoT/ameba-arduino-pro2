name: Arduino Index Builder

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Build ZIP and Update JSON
        id: build
        run: |
          TAG=$(git describe --tags --abbrev=0)
          FILENAME="ameba_pro2_${TAG}.zip"
          SOURCE_JSON="Arduino_package/package_realtek_amebapro2_index.json"
          RELEASE_DIR="./Arduino_package/release"
          
          mkdir -p $RELEASE_DIR
          zip -r "$RELEASE_DIR/${FILENAME}" Arduino_package/hardware/
          
          SHA=$(sha256sum "$RELEASE_DIR/${FILENAME}" | awk '{print $1}')
          SIZE=$(stat -c%s "$RELEASE_DIR/${FILENAME}")
          URL="https://github.com{{ github.repository }}/releases/download/${TAG}/${FILENAME}"
          
          # Create the new platform object
          NEW_RELEASE=$(jq -n \
            --arg ver "$TAG" --arg size "$SIZE" --arg sha "$SHA" \
            --arg file "$FILENAME" --arg url "$URL" \
            '{version: $ver, size: $size, checksum: ("SHA-256:"+$sha), archiveFileName: $file, url: $url}')

          # Prepend to the platforms array of the specific package
          jq --argjson new "$NEW_RELEASE" \
            '(.packages[] | select(.name == "ameba_pro2")).platforms |= [$new] + .' \
            "$SOURCE_JSON" > "${SOURCE_JSON}.tmp" && mv "${SOURCE_JSON}.tmp" "$SOURCE_JSON"
          
          # Copy to release folder for step 5
          cp "$SOURCE_JSON" "$RELEASE_DIR/"

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "zip_path=$RELEASE_DIR/${FILENAME}" >> $GITHUB_OUTPUT
          echo "json_asset=$RELEASE_DIR/$(basename $SOURCE_JSON)" >> $GITHUB_OUTPUT

          
      - name: 3. Verify JSON with Arduino Lint
        if: false  # <--- This disables the step
        uses: arduino/arduino-lint-action@v2
        with:
          # specifically tells the linter to check for "platform" (Boards Manager) rules
          path: ./Arduino_package/hardware 
          project-type: platform 
          compliance: strict

      - name: 4. Push Updated JSON
        if: success() # Only runs if the linting step passes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update index for ${{ steps.build.outputs.tag }}"
          file_pattern: 'Arduino_package/*.json'

      - name: 5. Create Release & Upload ZIP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build.outputs.tag }}
          files: |
            ${{ steps.build.outputs.zip_path }}
            ${{ steps.build.outputs.json_asset }}
          generate_release_notes: true
