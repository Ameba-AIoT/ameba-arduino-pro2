name: Arduino Index Builder

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Build ZIP and Update JSON
        id: build
        run: |
          # Define Variables
          TAG=$(git describe --tags --abbrev=0)
          FILENAME="ameba_pro2_${TAG}.zip"
          JSON_FILE="Arduino_package/package_realtek_amebapro2_index.json"
          
          # Create Release Folder & ZIP
          mkdir -p ./Arduino_package/release
          cd ./Arduino_package
          zip -r "./release/${FILENAME}" hardware/
          cd ..
          
          # Calculate Metadata
          SHA=$(sha256sum "./Arduino_package/release/${FILENAME}" | awk '{print $1}')
          SIZE=$(ls -l "./Arduino_package/release/${FILENAME}" | awk '{print $5}')
          
          # Use JQ to update the JSON platform entry
          # It finds the ameba_pro2 package and updates its platforms array
          tmp=$(mktemp)
          jq --arg sha "$SHA" --arg size "$SIZE" --arg ver "$TAG" --arg file "$FILENAME" \
            '(.packages[] | select(.name == "ameba_pro2")).platforms[] |= 
            (.version = $ver | .size = $size | .checksum = "SHA-256:" + $sha | .archiveFileName = $file | .url = "https://github.com\(env.GITHUB_REPOSITORY)/releases/download/\($ver)/\($file)")' \
            "$JSON_FILE" > "$tmp" && mv "$tmp" "$JSON_FILE"
          
          # Export for next steps
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "zip_path=./Arduino_package/release/${FILENAME}" >> $GITHUB_OUTPUT
          echo "json_asset=./Arduino_package/release/package_realtek_amebapro2_index.json" >> $GITHUB_OUTPUT
          
      - name: 3. Verify JSON with Arduino Lint
        if: false  # <--- This disables the step
        uses: arduino/arduino-lint-action@v2
        with:
          # specifically tells the linter to check for "platform" (Boards Manager) rules
          path: ./Arduino_package/hardware 
          project-type: platform 
          compliance: strict

      - name: 4. Push Updated JSON
        if: success() # Only runs if the linting step passes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update index for ${{ steps.build.outputs.tag }}"
          file_pattern: 'Arduino_package/*.json'

      - name: 5. Create Release & Upload ZIP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build.outputs.tag }}
          files: |
            ${{ steps.build.outputs.zip_path }}
            ${{ steps.build.outputs.json_asset }}
          generate_release_notes: true
