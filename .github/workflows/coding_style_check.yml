# This workflow runs coding_style_check test for Ameba Arduino SDK
name: Check mbed coding style
on:
  push:
  pull_request_target:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:
jobs:
  build-matrix:
    name: Build formatting matrix
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.repository == 'Ameba-AIoT/ameba-arduino-pro2') ||
      (github.event_name == 'pull_request_target') ||
      (github.event_name == 'schedule' && github.repository == 'Ameba-AIoT/ameba-arduino-pro2') ||
      (github.event_name == 'workflow_dispatch' && github.repository == 'Ameba-AIoT/ameba-arduino-pro2')
    outputs:
      matrix: ${{ steps.gen-matrix.outputs.matrix }}
      excluded_libs: ${{ env.EXCLUDED_LIBS }}
    env:
      # Customize excluded library directory names here (space-separated).
      # Entries with no "/" exclude an entire top-level library (job skipped).
      # Entries containing "/" (e.g. "Wire/src/Adafruit-PWM-Servo-Driver-Library")
      # are left alone here -- they don't match any top-level dir name, so the
      # parent library's job still runs; they're pruned later in formatting-check.
      EXCLUDED_LIBS: "TFLite Wire/src/Adafruit-PWM-Servo-Driver-Library FolderB"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          sparse-checkout: |
            Arduino_package/hardware/cores
            Arduino_package/hardware/libraries
      - name: Generate matrix JSON (exclude configurable libraries)
        id: gen-matrix
        run: |
          set -e
          CORE_PATH="Arduino_package/hardware/cores"
          LIB_ROOT="Arduino_package/hardware/libraries"
          echo "Excluded libraries: $EXCLUDED_LIBS"
          # Collect all first-level library directories
          ALL_LIB_DIRS=$(find "$LIB_ROOT" -mindepth 1 -maxdepth 1 -type d -printf '%P\n')
          echo "All library directories:"
          echo "$ALL_LIB_DIRS"
          # Filter out excluded names
          FILTERED_LIB_DIRS=""
          for d in $ALL_LIB_DIRS; do
            SKIP=false
            for ex in $EXCLUDED_LIBS; do
              if [ "$d" = "$ex" ]; then
                echo "Skipping excluded library: $d"
                SKIP=true
                break
              fi
            done
            if [ "$SKIP" = false ]; then
              FILTERED_LIB_DIRS="$FILTERED_LIB_DIRS $d"
            fi
          done
          echo "Libraries after exclusion:"
          echo "$FILTERED_LIB_DIRS"
          # Build JSON array: ["cores", "libraries/Lib1", "libraries/Lib2", ...]
          JSON="[\"$CORE_PATH\""
          for d in $FILTERED_LIB_DIRS; do
            JSON+=",\"$LIB_ROOT/$d\""
          done
          JSON+="]"
          echo "Matrix JSON: $JSON"
          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
  formatting-check:
    name: Run clang-format check
    needs: build-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        path: ${{ fromJson(needs.build-matrix.outputs.matrix) }}
    env:
      # Pulled from build-matrix's output -- single source of truth, no duplication.
      # Entries containing "/" are sub-paths to prune out of the checkout before
      # running clang-format on this job's path.
      EXCLUDED_LIBS: ${{ needs.build-matrix.outputs.excluded_libs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          sparse-checkout: |
            Arduino_package/hardware/cores
            Arduino_package/hardware/libraries
      - name: Checkout private clang-format config
        uses: actions/checkout@v4
        with:
          repository: M-ichae-l/python_script_private
          token: ${{ secrets.GH_PAT }}
          path: _clang_config
          sparse-checkout: |
            coding_style_mbed/.clang-format

      - name: Remove excluded sub-paths from this job's checkout
        run: |
          set -e
          LIB_ROOT="Arduino_package/hardware/libraries"
          for ex in $EXCLUDED_LIBS; do
            case "$ex" in
              */*)
                TARGET="$LIB_ROOT/$ex"
                if [ -e "$TARGET" ]; then
                  echo "Removing excluded sub-path: $TARGET"
                  rm -rf "$TARGET"
                fi
                ;;
            esac
          done

      - name: Run C/C++/header files check
        uses: M-ichae-l/clang-format-action@v1.0.0
        with:
          clang-format-version: '17'
          check-path: ${{ matrix.path }}
          clang-format-style-path: _clang_config/coding_style_mbed/.clang-format
          fallback-style: 'Mozilla'