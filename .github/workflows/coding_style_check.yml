# This workflow runs coding_style_check test for Ameba Arduino SDK
name: Check mbed coding style
on:
  push:
  pull_request_target:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:
jobs:
  build-matrix:
    name: Build formatting matrix
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.repository == 'Ameba-AIoT/ameba-arduino-pro2') ||
      (github.event_name == 'pull_request_target') ||
      (github.event_name == 'schedule' && github.repository == 'Ameba-AIoT/ameba-arduino-pro2') ||
      (github.event_name == 'workflow_dispatch' && github.repository == 'Ameba-AIoT/ameba-arduino-pro2')
    outputs:
      matrix: ${{ steps.gen-matrix.outputs.matrix }}
      excluded_folder: ${{ env.EXCLUDED_folder }}
      excluded_sub_folder: ${{ env.EXCLUDED_sub_folder }}
    env:
      # CASE 1: Whole top-level library directory names (space-separated).
      # Any exact match here skips that library's matrix job entirely --
      # it is never checked out or formatted-checked at all.
      EXCLUDED_folder: "TFLite FolderB"
      # CASE 2: Nested paths, relative to Arduino_package/hardware/libraries
      # (space-separated). The PARENT library still gets a matrix job and is
      # still checked, but this specific nested path is deleted from that
      # job's checkout before clang-format runs against it.
      EXCLUDED_sub_folder: "Wire/src/Adafruit-PWM-Servo-Driver-Library"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          sparse-checkout: |
            Arduino_package/hardware/cores
            Arduino_package/hardware/libraries
      - name: Debug - list libraries root before filtering
        run: |
          echo "---- Contents of Arduino_package/hardware/libraries ----"
          ls -la Arduino_package/hardware/libraries
          echo "---- Contents of Wire/src (checking sub-folder case) ----"
          ls -la Arduino_package/hardware/libraries/Wire/src || echo "Wire/src not found"
      - name: Generate matrix JSON (exclude configurable libraries)
        id: gen-matrix
        run: |
          set -e
          CORE_PATH="Arduino_package/hardware/cores"
          LIB_ROOT="Arduino_package/hardware/libraries"
          echo "EXCLUDED_folder     = $EXCLUDED_folder"
          echo "EXCLUDED_sub_folder = $EXCLUDED_sub_folder"
          # Collect all first-level library directories
          ALL_LIB_DIRS=$(find "$LIB_ROOT" -mindepth 1 -maxdepth 1 -type d -printf '%P\n')
          echo "All library directories:"
          echo "$ALL_LIB_DIRS"
          # Filter out excluded top-level names (CASE 1)
          FILTERED_LIB_DIRS=""
          for d in $ALL_LIB_DIRS; do
            SKIP=false
            for ex in $EXCLUDED_folder; do
              if [ "$d" = "$ex" ]; then
                echo "[CASE 1] Skipping excluded library entirely: $d"
                SKIP=true
                break
              fi
            done
            if [ "$SKIP" = false ]; then
              FILTERED_LIB_DIRS="$FILTERED_LIB_DIRS $d"
            fi
          done
          echo "Libraries after CASE 1 exclusion:"
          echo "$FILTERED_LIB_DIRS"
          # Build JSON array: ["cores", "libraries/Lib1", "libraries/Lib2", ...]
          JSON="[\"$CORE_PATH\""
          for d in $FILTERED_LIB_DIRS; do
            JSON+=",\"$LIB_ROOT/$d\""
          done
          JSON+="]"
          echo "Matrix JSON: $JSON"
          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
  formatting-check:
    name: Run clang-format check
    needs: build-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        path: ${{ fromJson(needs.build-matrix.outputs.matrix) }}
    env:
      EXCLUDED_sub_folder: ${{ needs.build-matrix.outputs.excluded_sub_folder }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          sparse-checkout: |
            Arduino_package/hardware/cores
            Arduino_package/hardware/libraries
      - name: Checkout private clang-format config
        uses: actions/checkout@v4
        with:
          repository: M-ichae-l/python_script_private
          token: ${{ secrets.GH_PAT }}
          path: _clang_config
          sparse-checkout: |
            coding_style_mbed/.clang-format

      - name: Remove excluded sub-folders (CASE 2) from this job's checkout
        run: |
          set -e
          LIB_ROOT="Arduino_package/hardware/libraries"
          echo "This job's matrix path: ${{ matrix.path }}"
          echo "EXCLUDED_sub_folder = $EXCLUDED_sub_folder"
          for sub in $EXCLUDED_sub_folder; do
            TARGET="$LIB_ROOT/$sub"
            echo "---- Checking: $TARGET ----"
            if [ -e "$TARGET" ]; then
              echo "BEFORE removal, contents:"
              ls -la "$(dirname "$TARGET")"
              echo "Removing excluded sub-folder: $TARGET"
              rm -rf "$TARGET"
              echo "AFTER removal, contents:"
              ls -la "$(dirname "$TARGET")"
            else
              echo "Not present in this checkout (either wrong path, or this job's matrix.path doesn't cover it): $TARGET"
            fi
          done

      - name: Run C/C++/header files check
        uses: M-ichae-l/clang-format-action@v1.0.0
        with:
          clang-format-version: '17'
          check-path: ${{ matrix.path }}
          clang-format-style-path: _clang_config/coding_style_mbed/.clang-format
          fallback-style: 'Mozilla'